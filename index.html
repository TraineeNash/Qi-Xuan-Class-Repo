<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- custom class: "change-location", "card","icon", "details", "time"-->

    <div class="my-5 mx-auto w-6/12 flex flex-col items-center">

        <!--form to enter city name-->
        <form class="change-location my-4 text-center text-gray-400">
            <label class="block mb-4"for="city">Enter a location for weather information</label>
            <input id="city" name="city" type="text" class="border rounded p-4 w-full">
        </form>

        <!--Card design of the weather information-->
        <div class="max-w-sm rounded overflow-hidden shadow-lg card">
            <img src="https://dummyimage.com/400x300" class="time">

            <div class="icon mx-auto text-center">
                <img src="" alt="">
            </div>

            <div class="text-gray-400 uppercase text-center details">
                <h5 class="my-3">City Name</h5>
                <div class="my-3">Weather Condition</div>
                <div class="text-4xl font-bold my-4">
                    <span>temp</span>
                    <span>&deg; C</span>
                </div>
            </div>
        </div>


    </div>


    <script src="script/forecast.js"></script>
    <script src="script/app.js"></script>
    
</body>
</html>
